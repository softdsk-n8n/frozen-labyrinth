<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frozen Labyrinth — Lineage 2 Interlude</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext x='16' y='24' font-size='22' text-anchor='middle' fill='%237fd4ff'%3E%E2%9D%84%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <link rel="stylesheet" href="styles.css?v=20260818d">
</head>
<body>
  <div id="map"></div>

  <!-- Северное сияние -->
  <div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>

  <!-- Морозный туман у подножия -->
  <div class="mist" aria-hidden="true"><i></i><i></i></div>

  <!-- Морозные уголки экрана -->
  <div class="frost" aria-hidden="true"></div>

  <!-- Ледяная виньетка поверх карты -->
  <div class="vignette" aria-hidden="true"></div>

  <!-- Заголовок поверх карты -->
  <div class="map-title" aria-hidden="true">
    <h1>Frozen Labyrinth</h1>
    <span>Lineage 2 · Interlude</span>
  </div>

  <!-- Роза ветров -->
  <svg class="compass" viewBox="0 0 100 100" aria-hidden="true">
    <circle cx="50" cy="50" r="46" fill="rgba(10,14,19,0.55)" stroke="#5a4b31" stroke-width="1.5"/>
    <circle cx="50" cy="50" r="38" fill="none" stroke="#5a4b31" stroke-width="0.7" opacity="0.7"/>
    <g fill="#e8d08d">
      <polygon points="50,8 45,42 50,38 55,42"/>
      <polygon points="92,50 58,45 62,50 58,55" opacity="0.5"/>
      <polygon points="50,92 45,58 50,62 55,58" opacity="0.5"/>
      <polygon points="8,50 42,45 38,50 42,55" opacity="0.5"/>
    </g>
    <g fill="#7fd4ff">
      <polygon points="50,16 47,44 50,41 53,44" opacity="0.9"/>
    </g>
    <circle cx="50" cy="50" r="3.2" fill="#e8d08d"/>
    <text x="50" y="7.5" font-size="9" text-anchor="middle" fill="#e8d08d" font-family="Cinzel, serif">N</text>
  </svg>

  <!-- Снегопад (декоративный): 4 слоя глубины + блёстки -->
  <div class="snowfall" aria-hidden="true">
    <div class="snow-layer snow-layer--far"></div>
    <div class="snow-layer snow-layer--mid"></div>
    <div class="snow-layer snow-layer--near"></div>
    <div class="snow-layer snow-layer--xl"></div>
    <div class="sparkles"></div>
    <div class="sparkles sparkles--alt"></div>
  </div>

  <!-- Панель управления -->
  <aside id="panel" class="l2-panel">
    <header class="panel-header">
      <h1 class="panel-title" data-i18n="title"></h1>
      <p class="panel-subtitle" data-i18n="subtitle"></p>
    </header>

    <section class="panel-section">
      <div class="lang-switch" id="langSwitch">
        <button class="l2-btn l2-btn--lang" data-lang="ru">RU</button>
        <button class="l2-btn l2-btn--lang" data-lang="en">EN</button>
      </div>
    </section>

    <section class="panel-section">
      <div class="filters" id="filters">
        <button class="l2-btn" data-filter="all" data-i18n="filterAll"></button>
        <button class="l2-btn" data-filter="npc" data-i18n="filterNpc"></button>
        <button class="l2-btn" data-filter="aggro" data-i18n="filterAggro"></button>
        <button class="l2-btn" data-filter="passive" data-i18n="filterPassive"></button>
      </div>
    </section>

    <section class="panel-section">
      <button class="l2-btn l2-btn--quest" id="questBtn" data-i18n="questBtn"></button>
      <button class="l2-btn l2-btn--guide" id="guideBtn" data-i18n="guideBtn"></button>
      <button class="l2-btn l2-btn--spawns" id="spawnsBtn" data-i18n="spawnsBtn"></button>
    </section>

    <section class="panel-section panel-section--mobs">
      <button class="l2-btn l2-btn--mobs" id="mobsToggle">
        <span data-i18n="mobListTitle"></span>
        <b class="caret" aria-hidden="true"></b>
      </button>
      <div class="mob-dropdown" id="mobDropdown" hidden>
        <div id="mobList" class="mob-list"></div>
      </div>
    </section>
  </aside>

  <!-- Боковая клавиша панели (мобильные) -->
  <button id="panelToggle" class="panel-toggle" aria-label="Меню">☰</button>

  <!-- Фоновая музыка (OST Lineage 2 — Snowfield Dawn) -->
  <button id="musicToggle" class="music-btn" aria-pressed="false" title="">
    <span class="music-note" aria-hidden="true">♫</span>
  </button>
  <div id="ytMusic" class="yt-music" aria-hidden="true"></div>

  <!-- Модальное окно: квест -->
  <div class="modal-backdrop" id="questModal" hidden>
    <div class="l2-panel modal" role="dialog" aria-modal="true">
      <header class="modal-header">
        <h2 id="questTitle"></h2>
        <button class="l2-btn l2-btn--close" id="questClose">&times;</button>
      </header>
      <div class="modal-body" id="questBody"></div>
    </div>
  </div>

  <!-- Модальное окно: гайд -->
  <div class="modal-backdrop" id="guideModal" hidden>
    <div class="l2-panel modal" role="dialog" aria-modal="true">
      <header class="modal-header">
        <h2 id="guideTitle"></h2>
        <button class="l2-btn l2-btn--close" id="guideClose">&times;</button>
      </header>
      <div class="modal-body" id="guideBody"></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="data.js?v=20260818d"></script>
  <script src="app.js?v=20260818d"></script>
</body>
</html>
